 ${rc}<textarea maxlength="1500" class="field" id="ms" placeholder="Write it the way you'd say it, if you weren't afraid." style="min-height:130px"></textarea><div class="sign"><span>with love,</span><input maxlength="40" id="fr" placeholder="your name" value="${esc(p.from||ME.name)}"></div>
 <div class="lbl" style="margin-bottom:6px">Keep it sealed until</div><select class="field" id="un">${opts.map(x=>`<option value="${x[0]}" ${x[0]==d?"selected":""}>${x[1]}</option>`).join("")}</select><button class="lnk" id="sl">Seal the letter</button>`;
 $("bk").onclick=home;if(ME.id)$("tp").onchange=()=>{$("tw").style.display=$("tp").value=="x"?"flex":"none"};
 $("sl").onclick=()=>{const m=$("ms").value.trim();if(!m){$("ms").focus();$("ms").placeholder="Write something first…";return}
  const tp=ME.id?$("tp").value:"x",fn=$("fr").value.trim()||"me",u=Date.now()+$("un").value*864e5;
  if(tp!="x"){const self=tp=="self",fr=fl.find(f=>f.id==tp),o={to:self?fn:fr.name,f:fn,m,u,q:p.q||"",saved:true,self};try{acct.send({to:self?ME.id:tp,toName:o.to,fromName:fn,body:m,q:o.q,unlock:u})}catch(e){toast(e.message);return}sent(o);return}
  const o={to:$("to").value.trim()||"you",f:fn,m,u,q:p.q||""};CAP.unshift(o);try{localStorage.setItem("ps_cap",JSON.stringify(CAP.slice(0,20)))}catch(e){}sent(o)}}
function ask(p){
 A.innerHTML=`<button class="lnk dim back" id="bk">← Home</button><div class="h2" style="margin-top:44px">I'd like to ask you something</div><p class="note" style="text-align:center">One question for anyone you want closer, near or far. They hold the card to read it, answer you, and can ask one back.</p>
 <div class="fld"><span>For</span><input maxlength="40" id="to" placeholder="their name" value="${esc(p.to||"")}"></div><div class="sign"><span>with love,</span><input maxlength="40" id="fr" placeholder="your name" value="${esc(p.from||ME.name)}"></div>
 <div class="row"><span class="lbl">Your question</span><button class="lnk dim" id="sp">Surprise me</button></div><select class="field" id="qs" style="margin-top:8px">${CHK.map(q=>`<option>${esc(q)}</option>`).join("")}<option value="">✎ Write my own…</option></select><textarea class="field" id="own" placeholder="Ask what you actually want to know." style="display:none"></textarea>
 <button class="lnk" id="mk">Make the card</button><div id="res"></div>`;
 const sh=()=>$("own").style.display=$("qs").value===""?"block":"none";$("qs").onchange=sh;if(p.own){$("qs").value="";sh()}
 $("sp").onclick=()=>{$("qs").selectedIndex=Math.floor(Math.random()*CHK.length);sh()};
 $("bk").onclick=home;$("mk").onclick=async()=>{const q=$("qs").value||$("own").value.trim();if(!q){$("own").focus();return}
  const o={to:$("to").value.trim()||"you",f:$("fr").value.trim()||"me",q},u=link("q",o),img=await drawQ({top:"I'd like to ask you something",q,to:o.to,f:o.f});
  $("res").innerHTML=`<img class="out" src="${img}" alt="Question card"><div class="row"><button class="lnk" id="s2">Share the card</button><button class="lnk dim" id="c2">Copy link</button></div>${FILE?`<p class="note">Links only open for others once this file is hosted online.</p>`:""}`;
  $("s2").onclick=()=>sheet(img,u,"Your question");$("c2").onclick=()=>cp("c2",u)}}
function inbox(k,o){const go=()=>history.replaceState(null,"",location.pathname);
 if(k=="p"){const ok=Date.now()>=o.u;A.innerHTML=`<div class="script" style="margin-top:30px">For Once</div><div class="seal">${SEAL}</div><p class="note" style="text-align:center">A letter for ${esc(o.to)}, with love from ${esc(o.f)}.<br>${ok?"It's waiting for you.":"Sealed until "+new Date(o.u).toLocaleDateString()+"."}</p>${ok?`<button class="lnk" id="op" style="display:block;margin:auto">Break the seal</button>`:""}<div id="lt"></div>`;
  if(ok)$("op").onclick=async()=>{const i=await draw(o);$("op").remove();$("lt").innerHTML=`${rcp("ipw",`<img class="out rimg" src="${i}" alt="Letter">`)}<div class="row"><button class="lnk" id="wb">Write one back</button><button class="lnk dim" id="ab">Ask them something</button></div><button class="lnk dim" id="sv" style="margin-top:8px">Save this card</button>`;
   runPrint("ipw");$("wb").onclick=()=>{go();letter({to:o.f,from:o.to,d:0})};$("ab").onclick=()=>{go();ask({to:o.f,from:o.to})};$("sv").onclick=()=>sheet(i,null,"Your letter")}}
 else{S.deck=[[1,o.q]];S.mode="s";
  A.innerHTML=`<div class="script" style="margin-top:26px;font-size:40px">${esc(o.f)} would like to ask you something</div><div class="card" id="cd" style="margin-top:20px"><div class="m"><span>For ${esc(o.to)}</span><span>For Once</span></div>${qhtml(esc(o.q))}</div><div class="row" style="margin-top:18px"><button class="lnk" id="an">Answer them</button><button class="lnk dim" id="ab">Ask them one back</button></div>`;
  holdable();$("an").onclick=()=>{go();letter({to:o.f,from:o.to,d:0,q:o.q})};$("ab").onclick=()=>{go();ask({to:o.f,from:o.to,own:1})}}}

let ME={name:"",email:""};
function auth(){A.innerHTML=`${hero()}<div style="margin-top:22px"><button class="lnk" id="ph">Sign up or log in with your phone</button></div><p class="note" style="margin:14px 0 2px">or look around first</p><div class="fld"><span>name</span><input maxlength="40" id="wn" placeholder="your first name (optional)" autocomplete="given-name" value="${esc(ME.name)}"></div><button class="lnk" id="gs" style="margin-top:6px">Continue as guest</button><p class="note" style="margin-top:24px">Guests keep everything on this device. Log in to keep your letters, add friends and get a notification when a letter opens.</p>`;
 $("ph").onclick=phoneScreen;$("gs").onclick=()=>{ME={name:$("wn").value.trim(),email:""};intro()}}
function intro(){const st=[["Pick a table","Dinner, a date, a late-night call. Choose the occasion you're in."],["Hold a card","Press and hold to open a question. The pause is the point."],["Answer for real","Say it out loud, or write first and reveal together so nobody copies."],["Leave a note","End with a P.S.: a short handwritten-style note to the person across from you."]];
 A.innerHTML=`${hero()}<div style="height:18px"></div>${st.map((x,i)=>`<div style="display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line)"><span style="font:italic 500 36px 'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;color:var(--blue)">${i+1}</span><div><div style="font:italic 500 25px 'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif">${x[0]}</div><div class="note" style="margin:2px 0 0">${x[1]}</div></div></div>`).join("")}<button class="lnk" id="go" style="margin-top:20px">Begin</button>`;
 $("go").onclick=home}
try{const m=location.hash.match(/^#([pq])=(.+)$/);if(m)inbox(m[1],cleanLink(m[1],d64(m[2])));else{const m=acct.me();if(m){setME(m);m.name?home():setup()}else{ME={name:"",email:""};home()}}}catch(e){ME={name:"",email:""};home()}
</script></body></html>
