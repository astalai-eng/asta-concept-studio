const NEWS={"en": {"roleq": "Who will use this chat?", "rolec": "I care for someone", "roles": "I am the patient", "capnote": "You can use Kapwa on your own if you can manage your medicines and daily care. If you ever feel confused or very unwell, tell me and a nurse will help. A family member can join too.", "tapbtn": "Please tap one of the buttons above.", "wbq": "How are you holding up? Caring is hard work.", "wbg": "I am okay", "wbt": "A bit tired", "wbs": "I am struggling", "wbok": "I am glad. Please remember to rest too.", "wbtired": "That is completely understandable. Caring for someone is hard work. Please rest when you can. If you would like to talk to someone, you can call The Samaritans on 2896 0000 (24 hours, many languages) or the government mental health support hotline on 18111 (24 hours, Cantonese and English). I can also ask a nurse to call you.", "wbstruggle": "Thank you for telling me. You are not alone. Are you having thoughts of ending your life or harming yourself?", "wby": "Yes", "wbn": "No", "wbno": "Thank you for being honest. A nurse will check in with you within 24 hours. If that ever changes, tell me right away, or call The Samaritans on 2896 0000 any time.", "crisis": "I am really sorry you are going through this. You are not alone, and your life matters. If you might act on these thoughts or you are in danger, call 999 now. You can also call The Samaritans on 2896 0000 (24 hours, many languages) or Samaritan Befrienders on 2389 2223 (English, 24 hours). A nurse will also call you now. You can keep writing to me.", "rec": "Your Care Experience Record"}, "id": {"roleq": "Siapa yang akan menggunakan obrolan ini?", "rolec": "Saya merawat orang", "roles": "Saya pasiennya", "capnote": "Anda dapat memakai Kapwa sendiri jika mampu mengatur obat dan perawatan harian. Jika Anda merasa bingung atau sangat tidak sehat, beri tahu saya dan seorang perawat akan membantu. Anggota keluarga juga bisa bergabung.", "tapbtn": "Silakan ketuk salah satu tombol di atas.", "wbq": "Bagaimana kabar Anda sendiri? Merawat itu melelahkan.", "wbg": "Saya baik", "wbt": "Agak lelah", "wbs": "Saya kesulitan", "wbok": "Syukurlah. Jangan lupa beristirahat juga.", "wbtired": "Saya sangat mengerti. Merawat orang memang melelahkan. Beristirahatlah sebentar jika bisa. Jika ingin berbicara dengan seseorang, Anda bisa menelepon The Samaritans di 2896 0000 (24 jam, banyak bahasa) atau hotline Departemen Tenaga Kerja untuk pekerja rumah tangga di 2157 9537 (24 jam). Saya juga bisa meminta perawat menelepon Anda.", "wbstruggle": "Terima kasih sudah memberi tahu saya. Anda tidak sendirian. Apakah Anda sedang berpikir untuk mengakhiri hidup atau melukai diri sendiri?", "wby": "Ya", "wbn": "Tidak", "wbno": "Terima kasih sudah jujur. Seorang perawat akan menghubungi Anda dalam 24 jam. Jika itu berubah, segera beri tahu saya atau hubungi The Samaritans di 2896 0000 kapan saja.", "crisis": "Saya sangat prihatin Anda mengalami ini. Anda tidak sendirian, dan hidup Anda berharga. Jika Anda mungkin bertindak atas pikiran ini atau dalam bahaya, hubungi 999 sekarang. Anda juga bisa menelepon The Samaritans di 2896 0000 (24 jam, banyak bahasa) atau Mental Health Direct Hospital Authority di 2466 7350 (24 jam). Seorang perawat juga akan menelepon Anda sekarang. Anda boleh terus menulis kepada saya.", "rec": "Catatan Pengalaman Perawatan Anda"}, "tl": {"roleq": "Sino po ang gagamit ng chat na ito?", "rolec": "Tagapag-alaga ako", "roles": "Ako po ang pasyente", "capnote": "Maaari ninyong gamitin ang Kapwa nang mag-isa kung kaya ninyong ayusin ang inyong gamot at pang-araw-araw na pangangalaga. Kung malito kayo o masama ang pakiramdam, sabihin sa akin at tutulungan kayo ng nurse. Maaari ring sumali ang kapamilya.", "tapbtn": "Pakipindot ang isa sa mga button sa itaas.", "wbq": "Kumusta po kayo? Nakakapagod ang pag-aalaga.", "wbg": "Okay po ako", "wbt": "Medyo pagod", "wbs": "Nahihirapan po ako", "wbok": "Masaya po akong marinig iyan. Huwag kalimutang magpahinga rin.", "wbtired": "Lubos ko pong naiintindihan. Nakakapagod talaga ang pag-aalaga. Magpahinga po kayo kahit sandali kapag kaya. Kung gusto ninyong may makausap, maaari kayong tumawag sa The Samaritans sa 2896 0000 (24 oras, may Tagalog) o sa hotline ng Labour Department para sa mga kasambahay sa 2157 9537 (24 oras). Maaari rin akong humiling sa nurse na tawagan kayo.", "wbstruggle": "Salamat po sa pagsasabi. Hindi kayo nag-iisa. May iniisip po ba kayong tapusin ang buhay ninyo o saktan ang sarili ninyo?", "wby": "Oo", "wbn": "Hindi", "wbno": "Salamat po sa pagiging tapat. Makikipag-ugnayan ang isang nurse sa loob ng 24 oras. Kung magbago ito, sabihin agad sa akin o tumawag sa The Samaritans sa 2896 0000 anumang oras.", "crisis": "Pasensya na po at pinagdadaanan ninyo ito. Hindi kayo nag-iisa, at mahalaga ang buhay ninyo. Kung maaari ninyong gawin ang mga kaisipang ito o nasa panganib kayo, tumawag sa 999 ngayon. Maaari rin kayong tumawag sa The Samaritans sa 2896 0000 (24 oras, may Tagalog) o sa Mental Health Direct ng Hospital Authority sa 2466 7350 (24 oras). Tatawagan din kayo ng isang nurse ngayon. Maaari kayong magpatuloy sa pagsulat sa akin.", "rec": "Ang Iyong Care Experience Record"}, "yue": {"roleq": "邊位會使用呢個對話？", "rolec": "我係照顧者", "roles": "我係病人", "capnote": "如果你識自己安排食藥同日常護理，就可以自己用 Kapwa。如果你覺得迷糊或者好唔舒服，請話我知，護士會幫你。家人亦可以一齊加入。", "tapbtn": "請㩒上面其中一個按鈕。", "wbq": "你自己仲頂唔頂得順？照顧人好辛苦㗎。", "wbg": "我OK", "wbt": "有啲攰", "wbs": "我頂唔順", "wbok": "咁就好。記得自己都要休息。", "wbtired": "你咁講我完全明白。照顧人真係好辛苦。得閒就休息下。如果想搵人傾下，可以打社會福利署照顧者支援專線 182 183（24小時）或者情緒通熱線 18111（24小時）。我亦可以請護士打電話俾你。", "wbstruggle": "多謝你話我知。你並唔孤單。你有冇諗過結束自己嘅生命或者傷害自己？", "wby": "有", "wbn": "冇", "wbno": "多謝你坦白講。護士會喺24小時內聯絡你。如果情況有變，請即刻話我知，或者隨時打撒瑪利亞會 2896 0000。", "crisis": "我好難過你而家要經歷呢啲。你並唔孤單，你嘅生命好重要。如果你可能會傷害自己或者處於危險，請即刻打999。你亦可以致電香港撒瑪利亞防止自殺會 2389 2222（24小時）或者生命熱線 2382 0000（24小時）。護士而家都會打電話俾你。你可以繼續同我傾。", "rec": "你嘅護理經驗紀錄"}, "zh": {"roleq": "谁会使用这个对话？", "rolec": "我是照顾者", "roles": "我是患者", "capnote": "如果您能自己管理用药和日常护理，就可以自己使用 Kap approve(){if(S.ok||!S.up||PLAN.some((p,i)=>p.low&&!S.cf[i]))return;S.ok=1;S.stage="lang";bot(Object.keys(LANGS).map(k=>WELS[k]).join("\n\n"),{list:1,btn:Object.keys(LANGS).map(k=>({k:"lang:"+k,l:LANGS[k]}))});render()},
sheet(i){S.sheet=i;S.sel=null;render()},close(){S.sheet=null;render()},pick(j){S.sel=j;render()},sendsel(){const i=S.sheet,j=S.sel;if(j===null||j===undefined)return;S.sheet=null;A.btn(i,j)},
btn(i,j){const m=S.chat[i];if(!m||!m.btn||m.used||!m.btn[j]||(m.d&&m.d!==S.day))return;const b=m.btn[j],[a,k]=b.k.split(":");m.used=1;const L=()=>TL();
if(a==="lang"){if(!T[k])return;S.lang=k;S.chat.push({f:"me",card:b.l,t:S.time});bot(L().thx);bot(L().con,{btn:[{k:"agree",l:L().agree}]});S.stage="consent"}
else if(a==="agree"){S.chat.push({f:"me",card:b.l,t:S.time});S.stage="role";bot(L().roleq,{btn:[{k:"role:care",l:L().rolec},{k:"role:self",l:L().roles}]})}
else if(a==="role"){S.chat.push({f:"me",x:b.l,t:S.time});S.role=k==="self"?"self":"caregiver";S.stage="live";if(S.role==="self")bot(L().capnote);bot(L().hi+"\n"+TASKS.map((x,n)=>(n+1)+". "+L().tasks[x]).join("\n"));bot(L().intro)}
else if(a==="done"){S.chat.push({f:"me",x:b.l,t:S.time});if(!S.done[k]){S.done[k]=1;S.n[k]++}delete S.pend[k];bot(L().ok)}
else if(a==="no"){S.chat.push({f:"me",x:b.l,t:S.time});const lt=S.tix.find(x=>x.id===S.lastLow);if(lt&&!lt.closed){lt.closed=1;lt.how="caregiver said all fine"}bot(L().good)}
else if(a==="wb"){S.chat.push({f:"me",x:b.l,t:S.time});if(k==="ok")bot(L().wbok);else if(k==="tired"){bot(L().wbtired);tix("low","Caregiver wellbeing: tired",b.l)}else if(k==="struggle"){tix("amber","Caregiver wellbeing: struggling (call within 24h)",b.l);bot(L().wbstruggle,{btn:[{k:"wb:yes",l:L().wby},{k:"wb:no",l:L().wbn}]})}else if(k==="yes"){bot(L().crisis);tix("red","Possible self-harm risk: call now","Answered yes to the direct question")}else bot(L().wbno)}
else if(a==="fine"){S.chat.push({f:"me",x:b.l,t:S.time});delete S.pend.check;bot(L().good)}
else{S.chat.push({f:"me",x:b.l,t:S.time});delete S.pend[m.rk];tix("amber","Helper needs help",T.en.tasks[m.rk]||"Helper reported Mr Chan is not well");S.await="describe";bot(L().askw)}
render()},
next(){if(S.stage!=="live")return;const [tm,k]=SCH[S.ti],L=TL();S.time=tm;if(S.paused){if(k==="sum"){S.day++;S.done={};S.pend={};S.ti=0}else S.ti++;render();return}
if(k==="sum"){const n=nDone();bot(L.sum.replace("{n}",n));S.fam.push({tier:n===5?"ok":"amber",x:"Day "+S.day+" summary: "+n+" of 5 tasks confirmed."});S.day++;S.done={};S.pend={};S.ti=0}
else{const missed=[];for(const p of Object.keys(S.pend)){if(S.pend[p]===1&&p!=="check"){S.fam.push({tier:"amber",x:"Not confirmed yet: "+T.en.tasks[p]});missed.push(p)}delete S.pend[p]}if(missed.length){const p=missed[missed.length-1];bot(L.nudge+"\n"+L.tasks[p],{rk:p,btn:[{k:"done:"+p,l:L.done},{k:"help",l:L.help}]})}
if(k==="check"){bot(L.chk,{rk:k,btn:[{k:"fine",l:L.fine},{k:"bad",l:L.bad}]});if(S.day%3===0)bot(L.wbq,{btn:[{k:"wb:ok",l:L.wbg},{k:"wb:tired",l:L.wbt},{k:"wb:struggle",l:L.wbs}]})}else bot(L.rem+": "+L.tasks[k],{rk:k,btn:[{k:"done:"+k,l:L.done},{k:"help",l:L.help}]});S.pend[k]=1;S.ti++}
render()},
auto(){if(S.auto){clearInterval(S.auto);S.auto=0}else S.auto=setInterval(A.next,3500);render()},
photo(){if(S.stage==="off")return;if(S.stage!=="live"){nudge();render();return}S.chat.push({f:"me",pic:1,t:S.time});bot(TL().hold);tix("amber","Wound photo","Helper sent a dressing photo");render()},
voice(){if(S.stage==="off")return;if(S.stage!=="live"){nudge();render();return}S.chat.push({f:"me",voice:1,t:S.time});bot(TL().amber);tix("amber","Voice note","Voice note received. Transcription and translation pending.");render()},
send(txt){if(S.stage==="off")return;const el=$("tx");const v=String(txt!==undefined?txt:(el?el.value:"")).trim();if(!v)return;S.chat.push({f:"me",x:v,t:S.time});if(el)el.value="";if(S.stage!=="live")nudge();else say(v);render()},
reply(id,k){const t=S.tix.find(x=>x.id===id);if(!t||t.closed||!TL().rep[k])return;t.closed=1;t.how=k;S.n.esc++;bot(TL().rep[k],{nurse:1});if(k!=="ok")S.fam.push({tier:"amber",x:"Nurse advised: "+({visit:"rest and a nurse phone call",er:"call 999"})[k]});render()},
seen(id){const t=S.tix.find(x=>x.id===id);if(t&&!t.closed){t.closed=1;t.how="seen"}render()},
fast(){if(S.stage!=="live"||S.fast)return;S.fast=1;S.n={med:30,med2:30,wound:30,walk:84,fluid:60,esc:Math.max(S.n.esc,2)};S.time="21:05";bot(TL().rec,{doc:1});render()},
tab(k){S.tab=k;render()}};
const row=(l,sub,v,dot)=>`<div class="r">${dot?`<i class="dot ${dot}"></i>`:""}<div>${l}${sub?`<small>${sub}</small>`:""}</div><span class="v">${v||""}</span></div>`;
function staff(){
const live=S.stage==="live",nx=SCH[S.ti],todo=PLAN.filter((p,i)=>p.low&&!S.cf[i]).length;
const st=!S.up?1:!S.ok?2:S.stage==="lang"?3:S.stage==="consent"||S.stage==="role"?4:5;
const G=[["Family uploads the discharge papers","In real life the family sends a photo or PDF. Press the button to simulate it.",`<button class="btn" onclick="A.up()">Upload discharge papers</button>`],
["The nurse checks the plan",todo?todo+" item"+(todo>1?"s need":" needs")+" a nurse decision. Press Confirm on each, then approve below.":"All items confirmed. Press Approve below to send the plan to the helper.",""],
["The caregiver gets a WhatsApp message","Look at the phone chat. Tap Choose language and pick one.",`<button class="btn s" onclick="A.skip()">Skip: caregiver picks English and agrees</button>`],
["The caregiver agrees to the privacy terms","Tap Agree inside the phone chat.",`<button class="btn s" onclick="A.skip()">Skip: caregiver agrees</button>`],
["The day now runs on automatic reminders","Press Send next reminder, then tap Done or Need help in the phone chat.",""]][st-1];
const AL={red:"Urgent",amber:"Check",ok:"OK"};
const open=S.tix.filter(t=>!t.closed&&t.tier!=="low").length,al=S.fam.filter(a=>a.tier!=="ok").length;
let h=`<div class="hd"><span class="brand">${logo(30,10)}<b>Kapwa</b><span>Clinical</span></span>
<div class="days">${["Upload","Review","Invite","Consent","Live"].map((s,i)=>`<div class="d ${i+1===st?"on":""}"><small>${s}</small><b>${i+1}</b></div>`).join("")}</div>
<div class="pl" role="tablist">${[["family","Family"],["nurse","Nurse"]].map(([k,n])=>`<button role="tab" aria-selected="${S.tab===k}" onclick="A.tab('${k}')">${n}</button>`).join("")}</div>
<div class="hero"><b>${S.time}</b><small>Day ${S.day}</small></div>
<div class="tl"><div class="t"><small>Tasks done</small><b>${nDone()}/5</b></div><div class="t"><small>Alerts</small><b>${al}</b></div><div class="t"><small>Open questions</small><b>${open}</b></div></div></div>
<div class="sh"><div class="step"><small>Step ${st} of 5</small><b>${G[0]}</b><p>${G[1]}</p>${G[2]}</div>`;
if(live)h+=`<div class="gh">Automation clock</div><div class="g"><div class="r"><div class="clk"><b>Day ${S.day}, ${S.time}</b><small>Next: ${nx[0]} ${({sum:"day summary",check:"check-in"}[nx[1]]||T.en.tasks[nx[1]].split("(")[0].trim())}</small></div></div><div class="r"><div class="acts"><button onclick="A.next()">Send next reminder</button><button onclick="A.auto()">${S.auto?"Stop auto-play":"Auto-play the day"}</button><button onclick="A.fast()" ${S.fast?"disabled":""}>Skip to day 30</button></div></div></div>`;
if(S.tab==="family"){h+=`<h1>Mr Chan</h1><p class="sub">Hip fracture recovery. Synthetic sample patient.</p><div class="g">${row("Discharge papers","",S.up?'<span class="badge o">Uploaded</span>':'<span class="badge">Not uploaded</span>')}${row("Caregiver on WhatsApp","",live?'<span class="badge o">Active</span>':S.ok?'<span class="badge w">Awaiting consent</span>':'<span class="badge">Not started</span>')}</div><div class="gh">Alerts</div><div class="g">${S.fam.length?S.fam.slice().reverse().map(a=>row(esc(a.x),"",`<span class="badge ${a.tier==="red"?"":a.tier==="ok"?"o":"w"}">${AL[a.tier]}</span>`,a.tier)).join(""):row("No alerts yet","","")}</div><div class="gf">Families see patient status and alerts only, never the caregiver’s chats or location.</div>`}
else{h+=`<h1>Care plan review</h1><p class="sub">Nothing reaches the caregiver until a nurse approves it.</p>`;
if(!S.up)h+=`<div class="g">${row("No discharge papers yet","Upload them in step 1.","")}</div>`;
else h+=`<div class="g">${PLAN.map((p,i)=>row(p.t,p.src,p.low&&!S.cf[i]?`<button class="mini" onclick="A.confirm(${i})">Confirm</button>`:p.low?'<span class="badge o">Confirmed</span>':Math.round(p.c*100)+"%")).join("")}</div><div class="gf">Extraction is simulated from a synthetic sample. Items the documents do not cover are flagged for the nurse to complete.</div><button class="btn ${S.ok?"ds":""}" onclick="A.approve()" ${S.ok||todo?"disabled":""}>${S.ok?"Plan approved and sent":todo?"Confirm "+todo+" more to approve":"Approve and send to caregiver"}</button>`;
h+=`<div class="gh">Caregiver questions for the nurse</div>${S.tix.length?S.tix.map(t=>`<div class="g" style="margin-bottom:10px"><div class="r"><i class="dot ${t.tier}"></i><div>${esc(t.kind)}<small>${esc(t.x)}</small></div><span class="v">${t.closed?"Closed":t.tier==="red"?"Call now":t.tier==="low"?"Review":"Reply in 30 min"}</span></div>${t.closed?"":`<div class="r"><div class="acts">${t.tier==="low"?`<button onclick="A.seen(${t.id})">Mark as seen</button>`:""}<button onclick="A.reply(${t.id},'ok')">Looks normal</button><button onclick="A.reply(${t.id},'visit')">Rest, I will call</button><button onclick="A.reply(${t.id},'er')">Call 999</button></div></div>`}</div>`).join(""):`<div class="g">${row("None yet","","")}</div>`}`}
h+=`</div>${live?`<button class="fab" aria-label="Send next reminder" onclick="A.next()">${I.plus}</button>`:""}`;
$("staff").innerHTML=h}
const P=(d,x)=>`<svg viewBox="0 0 24 24" width="${x||24}" height="${x||24}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={list:P('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',18),reply:P('<path d="M9 7L4 12l5 5"/><path d="M4 12h9a7 7 0 017 7"/>',18),doc:P('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>'),plus:P('<path d="M12 5v14M5 12h14"/>',28),stk:P('<path d="M5 3h14v10l-6 6H5z"/><path d="M13 19v-6h6"/>',22),cam:P('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',26),mic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" stroke-width="2" fill="none"/></svg>',send:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 20.5v-6.8l9-1.7-9-1.7V3.5L22 12 3 20.5z"/></svg>',play:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',back:P('<path d="M15 5l-7 7 7 7"/>',22),ver:'<svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none"/></svg>',tk:'<svg viewBox="0 0 18 12" width="17" height="11"><path d="M1 6.5l3.5 3.5L11 2M7 9.5l1 1L15.5 2" stroke="#34b7f1" stroke-width="1.6" fill="none"/></svg>'};
function tg(){const v=($("tx")||{}).value||"",e=v.trim()!=="";for(const [i,d] of [["cm",!e],["mic",!e],["sd",e]]){const n=$(i);if(n)n.style.display=d?"":"none"}}
const LM={en:"en",id:"id",tl:"fil",yue:"zh-HK",zh:"zh-CN"};
function bub(m,i){const tm=`<em>${m.t||""}${m.f==="me"?I.tk:""}</em>`;
if(m.card)return `<div class="b me card"><span class="ic">${I.doc}</span><div><b>${esc(m.card)}</b><span class="s">Response sent</span></div>${tm}<div class="vr">View response</div></div>`;
if(m.pic)return `<div class="b me"><div class="pic">Wound photo</div>${tm}</div>`;
if(m.voice)return `<div class="b me"><div class="vn">${I.play}<i></i><span>0:07</span></div>${tm}</div>`;
if(m.doc)return `<div class="b card"><span class="ic">${I.doc}</span><div><b>${esc(m.x)}</b><span class="s">Care Experience Record.pdf, 1 page</span></div><div style="grid-column:1/3;font-size:14px">Reviewed by the supervising nurse. Medicines ${S.n.med+S.n.med2}, wound checks ${S.n.wound}, supervised walks ${S.n.walk}, fluids ${S.n.fluid}. ID KAP-DEMO-0001. A nurse-reviewed experience record. It is not a certificate or an accredited qualification.</div>${tm}</div>`;
return `<div class="b ${m.f}">${m.nurse?"<small>Nurse</small>":""}${esc(m.x)}${tm}${m.btn&&m.list?`<div class="bn"><button ${m.used?"disabled":""} onclick="A.sheet(${i})">${I.list}Choose language / 選擇語言</button></div>`:m.btn?`<div class="bn">${m.btn.map((b,j)=>`<button ${m.used||(m.d&&m.d!==S.day)?"disabled":""} onclick="A.btn(${i},${j})">${I.reply}${esc(b.l)}</button>`).join("")}</div>`:""}</div>`}
function sheetHtml(){if(S.sheet===null)return"";const m=S.chat[S.sheet];if(!m||!m.btn)return"";return `<div class="dim" onclick="A.close()"></div><div class="sheet" role="dialog" aria-label="Choose language"><h4>Choose language / 選擇語言</h4>${m.btn.map((b,j)=>`<button class="opt" role="radio" aria-checked="${S.sel===j}" onclick="A.pick(${j})"><span>${esc(b.l)}</span><i class="rd"></i></button>`).join("")}<button class="sendb" ${S.sel===null?"disabled":""} onclick="A.sendsel()">Send</button></div>`}
function phone(){
const tx=$("tx"),keep=tx?tx.value:"";
$("phone").innerHTML=`<div class="sb"><span>${S.time}</span><span><svg viewBox="0 0 20 14" width="20" height="14" fill="currentColor"><rect x="0" y="9" width="3" height="5"/><rect x="5" y="6" width="3" height="8"/><rect x="10" y="3" width="3" height="11"/><rect x="15" y="0" width="3" height="14" opacity=".35"/></svg><span class="bt">83</span></span></div>
<div class="nav"><span class="back">${I.back}3</span><span class="av">${logo(40,20)}</span><div><b>Kapwa Care ${I.ver}</b><small>Business account</small></div></div>
<div class="chat" id="chat" role="log" aria-live="polite">${S.chat.length?S.chat.map((m,i)=>bub(m,i).replace('<div class="b ',`<div lang="${LM[m.l||S.lang]}" class="b `)).join(""):`<span class="note">Kapwa Care messages the caregiver here after the nurse approves the plan (step 2).</span>`}</div>
<div class="ib"><button aria-label="Attach">${I.plus}</button><div class="fld"><input id="tx" aria-label="Message" autocomplete="off" oninput="tg()" onkeydown="if(event.key==='Enter')A.send()"><span>${I.stk}</span></div><button id="cm" aria-label="Camera" onclick="A.photo()">${I.cam}</button><button class="mic" id="mic" aria-label="Voice message" onclick="A.voice()">${I.mic}</button><button class="mic" id="sd" aria-label="Send" style="display:none" onclick="A.send()">${I.send}</button></div><div class="hm"></div>${sheetHtml()}`;
const t2=$("tx");if(t2&&keep){t2.value=keep;tg()}const c=$("chat");if(c)c.scrollTop=c.scrollHeight}
function render(){staff();phone()}
render();
</script></body></html>
